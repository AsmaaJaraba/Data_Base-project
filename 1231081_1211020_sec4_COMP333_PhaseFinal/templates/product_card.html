<div class="product-card">
  <div class="product-image">
    {% if product.image_filename %}
      <img src="{{ url_for('static', filename='uploads/' ~ product.image_filename) }}" alt="{{ product.name }}">
    {% else %}
      <img src="https://images.unsplash.com/photo-1513475382585-d06e58bcb0e0?auto=format&fit=crop&w=900&q=80" alt="{{ product.name }}">
    {% endif %}
  </div>

  <div class="product-info">
    <h3 class="product-title">{{ product.name }}</h3>

    <div class="product-category">
      <i class="fas fa-tag"></i>
      <span>{{ product.category_name or product.product_type }}</span>
    </div>

    {% if product.description %}
      <p class="product-desc">{{ product.description }}</p>
    {% endif %}

    <div class="product-price">
      <span class="current-price">{{ "%.2f"|format(product.price) }} ILS</span>
    </div>

    <div class="product-buttons">
      <a class="btn btn-primary" href="{{ url_for('product_details', pid=product.id) }}">
        View Details
      </a>

      <button type="button"
              class="btn btn-secondary"
              onclick="addToCartAndGo({{ product.id }})">
        Add to Cart
      </button>
    </div>
  </div>
</div>

<script>
  async function addToCartAndGo(productId){
    try{
      const r = await fetch("/api/cart/add", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ product_id: productId, qty: 1 })
      });
      const j = await r.json();

      if (!j.ok){
        if (j.error === "NOT_LOGGED_IN"){
          window.location.href = "/login";
          return;
        }
        alert("Error: " + (j.error || "UNKNOWN"));
        return;
      }

     
      window.location.href = "/cart";
    }catch(e){
      alert("Network error");
    }
  }
</script>
