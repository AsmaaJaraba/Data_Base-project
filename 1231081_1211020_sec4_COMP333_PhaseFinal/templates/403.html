<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>403 - Forbidden</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .wrap{
      max-width: 900px;
      margin: 2rem auto;
      background:#fff;
      border-radius:14px;
      padding: 1.5rem;
      box-shadow:0 5px 15px rgba(0,0,0,.08);
      text-align:center;
    }
    .code{
      font-size: 2.5rem;
      font-weight: 900;
      color:#dc3545;
      margin-bottom: .5rem;
    }
    .msg{
      font-size: 1.1rem;
      color:#333;
      margin-bottom: 1rem;
    }
    .btn{
      display:inline-block;
      padding: 10px 16px;
      border-radius: 10px;
      background:#1a365d;
      color:#fff;
      text-decoration:none;
      font-weight:800;
    }
    .btn:hover{ background:#14304f; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">403</div>
    <div class="msg">You don’t have permission to access this page.</div>
    <a class="btn" href="/">Go Home</a>
  </div>
</body>
</html>
