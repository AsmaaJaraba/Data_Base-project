<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب - مكتبة بيرزيت</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --primary-blue:#003366; --secondary-blue:#00509E; --accent-green:#28A745;
      --accent-orange:#FF6B35; --light-gray:#F5F5F5; --dark-gray:#333; --white:#fff;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
    body{background:linear-gradient(135deg,#003366 0%,#00509E 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
    .card{width:100%;max-width:520px;background:var(--white);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.2);padding:2.2rem;}
    .header{text-align:center;margin-bottom:1.5rem;}
    .logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px;}
    .logo img{height:52px}
    .header h1{font-size:1.8rem;color:var(--primary-blue)}
    .header p{color:#666;margin-top:.4rem}

    .flash{padding:10px 12px;border-radius:12px;margin-bottom:12px;font-size:.95rem}
    .flash.error{background:#ffe7e7;color:#a40000;border:1px solid #ffb6b6}
    .flash.success{background:#e7ffef;color:#0a6b2b;border:1px solid #b6ffd0}

    label{display:block;margin:.9rem 0 .4rem;font-weight:600;color:var(--dark-gray)}
    input, select{
      width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:1rem;
    }
    input:focus, select:focus{outline:none;border-color:var(--primary-blue);box-shadow:0 0 0 3px rgba(0,51,102,.1)}
    .row{display:grid;grid-template-columns:1fr;gap:.8rem}

    .btn{
      margin-top:1.4rem;width:100%;padding:14px;border:none;border-radius:10px;
      background:var(--accent-green);color:var(--white);font-size:1.05rem;font-weight:700;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:10px;
    }
    .btn:hover{background:#218838}
    .links{margin-top:1.2rem;text-align:center;color:#666}
    .links a{color:var(--primary-blue);text-decoration:none;font-weight:700}
    .links a:hover{text-decoration:underline}
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div class="logo">
        <img src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png" alt="مكتبة بيرزيت">
        <h1>إنشاء حساب جديد</h1>
      </div>
      <p>أنشئ حسابك لتتمكني من الطلب والشراء وتتبع الطلبات</p>
    </div>


    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}">
      <label for="name">الاسم</label>
      <input id="name" name="name" type="text" placeholder="اسمك الكامل" required>

      <label for="email">البريد الإلكتروني</label>
      <input id="email" name="email" type="email" placeholder="example@email.com" required>

      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" placeholder="على الأقل 6 أحرف" minlength="6" required>

    
      <input type="hidden" name="role" value="student">

      <button class="btn" type="submit">
        <i class="fas fa-user-plus"></i>
        إنشاء الحساب
      </button>
    </form>

    <div class="links">
      عندك حساب؟ <a href="{{ url_for('login') }}">سجّلي الدخول</a><br>
      <a href="{{ url_for('index') }}">العودة للرئيسية</a>
    </div>
  </div>

</body>
</html>
